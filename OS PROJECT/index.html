<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie & Orphan Simulator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-mode">
    <div class="grid-background"></div>
    
    <header class="main-header">
        <div class="logo">
            <i class="fas fa-microchip"></i>
            <h1>Zombie & Orphan <span>Simulator</span></h1>
        </div>
        <div class="system-status">
            <span class="status-indicator active"></span> System Active
            <span id="global-process-count" class="badge">1 Processes</span>
        </div>
    </header>

    <main class="dashboard">
        <section class="panel tree-panel">
            <div class="panel-header">
                <i class="fas fa-sitemap"></i> <h2>Process Tree</h2>
            </div>
            <div id="process-tree-container" class="tree-content">
                </div>
        </section>

        <section class="panel controls-panel">
            <div class="panel-header">
                <i class="fas fa-bolt"></i> <h2>Controls</h2>
            </div>
            
            <div class="button-group">
                <button id="btn-create-parent" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Create Parent
                </button>
                <button id="btn-create-child" class="btn btn-secondary">
                    <i class="fas fa-child"></i> Create Child
                </button>
                <hr>
                <button id="btn-kill-parent" class="btn btn-danger">
                    <i class="fas fa-skull-crossbones"></i> Kill Parent
                </button>
                <button id="btn-kill-child" class="btn btn-warning">
                    <i class="fas fa-eraser"></i> Kill Child
                </button>
                <button id="btn-reap" class="btn btn-accent">
                    <i class="fas fa-recycle"></i> Wait / Reap Zombie
                </button>
                <button id="btn-reset" class="btn btn-ghost">
                    <i class="fas fa-undo"></i> Reset Simulation
                </button>
            </div>

            <div class="settings-box">
                <h3>SIMULATION SPEED</h3>
                <div class="range-container">
                    <span>0.5x</span>
                    <input type="range" id="speed-slider" min="0.5" max="2" step="0.5" value="1">
                    <span>2x</span>
                </div>
                <button id="btn-pause" class="btn btn-outline-warning">
                    <i class="fas fa-pause"></i> Pause
                </button>
            </div>
        </section>

        <section class="panel info-panel">
            <div class="panel-header">
                <i class="fas fa-terminal"></i> <h2>Event Log</h2>
            </div>
            <div id="event-log" class="terminal-log">
                <div class="log-entry info">[00:00:00] System Initialized...</div>
            </div>

            <div class="process-details" id="details-panel">
                <div class="panel-header">
                    <i class="fas fa-info-circle"></i> <h2>Selected Process</h2>
                </div>
                <div class="details-grid">
                    <label>Name:</label> <span id="detail-name">-</span>
                    <label>PID:</label> <span id="detail-pid">-</span>
                    <label>State:</label> <span id="detail-state">-</span>
                    <label>Parent PID:</label> <span id="detail-ppid">-</span>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
